[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambientsensebench"
version = "0.1.0"
description = "Reproducible ambient-sensing scenario generator and anomaly-detection benchmark."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ambient sensing", "anomaly detection", "benchmark", "synthetic data", "smart home"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "psutil>=5.9",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.7",
]
dev = [
    "matplotlib>=3.7",
    "pytest>=7.4",
]

[project.scripts]
ambientsensebench = "ambientsensebench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ambientsensebench = ["config/*.yaml", "web/*.css", "web/*.html", "web/*.js"]
